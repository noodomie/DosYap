<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dosyap - Hızlı Dosya Paylaşımı</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b1120;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #151f32;
      border: 1px solid #1e293b;
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon-header {
      width: 64px;
      height: 64px;
      background: rgba(37, 99, 235, 0.15);
      border: 2px solid #2563eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: #3b82f6;
    }
    h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .file-input-wrapper {
      border: 2px dashed #334155;
      border-radius: 14px;
      padding: 30px 16px;
      cursor: pointer;
      background: rgba(30, 41, 59, 0.3);
      transition: all 0.2s;
    }
    .file-input-wrapper:hover {
      border-color: #3b82f6;
      background: rgba(37, 99, 235, 0.05);
    }
    input[type="file"] {
      display: none;
    }
    .progress-container {
      display: none;
      margin-top: 20px;
    }
    .progress-bar-bg {
      background: #1e293b;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      height: 100%;
      width: 0%;
      transition: width 0.1s linear;
    }
    .progress-text {
      font-size: 13px;
      color: #94a3b8;
    }
    .file-link-box {
      background: #0f172a;
      border: 1px dashed #3b82f6;
      border-radius: 10px;
      padding: 12px;
      word-break: break-all;
      color: #60a5fa;
      font-family: monospace;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .qr-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 20px;
    }
    .qr-container img {
      width: 180px;
      height: 180px;
      display: block;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.8;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
    }
    .btn-purple {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: #ffffff;
    }
    .btn-teal {
      background: linear-gradient(135deg, #0d9488, #0f766e);
      color: #ffffff;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #334155;
      color: #cbd5e1;
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .file-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      text-align: left;
      transition: opacity 0.3s, transform 0.3s;
    }
    .file-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      text-decoration: none;
      color: inherit;
    }
    .file-icon {
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .file-info {
      overflow: hidden;
    }
    .file-title {
      font-weight: 600;
      font-size: 15px;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-meta {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }
    .card-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .btn-sm {
      padding: 8px 0;
      font-size: 12px;
      border-radius: 8px;
    }
    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #ffffff;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: #f8fafc;
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid #3b82f6;
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .view-section {
      display: none;
    }
    .view-section.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="viewUpload" class="view-section active">
      <div class="icon-header">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
      </div>
      <h2>Dosya Yükle</h2>
      <p class="subtitle">Dosyanızı seçip hemen paylaşın.</p>
      
      <div class="file-input-wrapper" onclick="triggerFileSelect()">
        <svg width="32" height="32" fill="none" stroke="#64748b" stroke-width="2" viewBox="0 0 24 24" style="margin-bottom: 8px;"><path d="M12 4v16m8-8H4"></path></svg>
        <p style="font-size: 14px; color: #94a3b8;">Cihazınızdan bir dosya seçin</p>
      </div>
      <input type="file" id="fileInput" onchange="uploadFile()">

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">%0 yükleniyor...</div>
      </div>

      <div style="margin-top: 16px;">
        <button class="btn btn-outline" onclick="showView('viewFiles')">Dosyalarım</button>
      </div>
    </div>

    <div id="viewReady" class="view-section">
      <div class="icon-header">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
      </div>
      <h2>Dosya Hazır</h2>
      <p class="subtitle">Aşağıdaki link ve QR kod ile dosyanızı paylaşabilirsiniz.</p>

      <div class="file-link-box" id="readyLinkText"></div>

      <div class="qr-container">
        <img id="readyQrImg" src="" alt="QR Kod">
      </div>

      <div class="button-group">
        <button class="btn btn-primary" onclick="copyReadyLink()">Link Kopyala</button>
        <button class="btn btn-purple" onclick="downloadQrCode()">QR Kodu İndir</button>
        <button class="btn btn-teal" id="shareBtn" onclick="shareReadyLink()">Paylaş</button>
        <button class="btn btn-outline" onclick="showView('viewUpload')">Ana Sayfa</button>
      </div>
    </div>

    <div id="viewFiles" class="view-section">
      <div class="icon-header">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 002-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
      </div>
      <h2>Dosyalarım</h2>
      <p class="subtitle">Yüklediğiniz dosyaları buradan yönetebilirsiniz.</p>

      <div id="filesListContainer"></div>

      <button class="btn btn-outline" onclick="showView('viewUpload')" style="margin-top: 12px;">Ana Sayfa</button>
    </div>
  </div>

  <div id="toast" class="toast">İşlem Başarılı</div>

  <script>
    let currentUploadedFile = null;

    function vibrate(ms = 40) {
      if (navigator.vibrate) {
        navigator.vibrate(ms);
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function showView(viewId) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      if (viewId === 'viewFiles') {
        loadFilesList();
      }
    }

    function triggerFileSelect() {
      document.getElementById('fileInput').click();
    }

    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) return '🖼️';
      if (['mp4', 'mkv', 'avi', 'mov', 'webm'].includes(ext)) return '🎥';
      if (['mp3', 'wav', 'ogg', 'm4a', 'flac'].includes(ext)) return '🎵';
      if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return '📦';
      if (['pdf', 'doc', 'docx', 'txt', 'rtf'].includes(ext)) return '📄';
      if (['js', 'html', 'css', 'json', 'py', 'cpp', 'java'].includes(ext)) return '💻';
      if (['apk', 'exe', 'msi'].includes(ext)) return '⚙️';
      return '📁';
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function uploadFile() {
      const input = document.getElementById('fileInput');
      if (!input.files.length) return;

      const file = input.files[0];
      const formData = new FormData();
      formData.append('file', file);

      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');

      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';
      progressText.innerText = '%0 yükleniyor...';

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload', true);

      xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
          const percent = Math.round((e.loaded / e.total) * 100);
          progressBar.style.width = percent + '%';
          progressText.innerText = '%' + percent + ' yükleniyor...';
        }
      };

      xhr.onload = function() {
        progressContainer.style.display = 'none';
        input.value = '';
        if (xhr.status === 200) {
          const res = JSON.parse(xhr.responseText);
          if (res.success) {
            vibrate(60);
            currentUploadedFile = res.file;
            setupReadyView(res.file);
            showView('viewReady');
            showToast('Dosya başarıyla yüklendi!');
          }
        } else {
          showToast('Yükleme hatası oluştu!');
        }
      };

      xhr.onerror = function() {
        progressContainer.style.display = 'none';
        showToast('Bağlantı hatası!');
      };

      xhr.send(formData);
    }

    function setupReadyView(file) {
      const shareUrl = window.location.origin + '/dosya/' + file.id;
      document.getElementById('readyLinkText').innerText = shareUrl;
      const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(shareUrl);
      document.getElementById('readyQrImg').src = qrUrl;
    }

    function copyReadyLink() {
      const text = document.getElementById('readyLinkText').innerText;
      navigator.clipboard.writeText(text);
      vibrate(30);
      showToast('Link kopyalandı!');
    }

    function downloadQrCode() {
      const img = document.getElementById('readyQrImg');
      const a = document.createElement('a');
      a.href = img.src;
      a.download = 'qrcode.png';
      a.target = '_blank';
      a.click();
      vibrate(30);
    }

    function shareReadyLink() {
      const shareUrl = document.getElementById('readyLinkText').innerText;
      if (navigator.share) {
        navigator.share({
          title: 'Dosya Paylaşımı',
          text: 'Dosyap üzerinden paylaşılan dosya:',
          url: shareUrl
        }).catch(() => {});
        vibrate(30);
      } else {
        copyReadyLink();
      }
    }

    function loadFilesList() {
      const container = document.getElementById('filesListContainer');
      container.innerHTML = '<p style="color:#64748b; font-size:14px;">Yükleniyor...</p>';

      fetch('/api/files')
        .then(res => res.json())
        .then(files => {
          if (!files.length) {
            container.innerHTML = '<p style="color:#64748b; font-size:14px;">Henüz yüklenmiş dosya yok.</p>';
            return;
          }
          container.innerHTML = '';
          files.forEach(file => {
            const icon = getFileIcon(file.name);
            const sizeStr = formatBytes(file.size);
            const fileUrl = window.location.origin + '/dosya/' + file.id;

            const card = document.createElement('div');
            card.className = 'file-card';
            card.id = 'file-card-' + file.id;
            card.innerHTML = `
              <a href="${fileUrl}" target="_blank" class="file-header">
                <div class="file-icon">${icon}</div>
                <div class="file-info">
                  <div class="file-title">${file.name}</div>
                  <div class="file-meta">${file.name} • ${sizeStr}</div>
                </div>
              </a>
              <div class="card-actions">
                <button class="btn btn-primary btn-sm" onclick="copyLink('${fileUrl}')">Kopyala</button>
                <button class="btn btn-purple btn-sm" onclick="openQrModal('${fileUrl}')">QR Kod</button>
                <button class="btn btn-danger btn-sm" onclick="deleteFile('${file.id}')">Sil</button>
              </div>
            `;
            container.appendChild(card);
          });
        })
        .catch(() => {
          container.innerHTML = '<p style="color:#ef4444; font-size:14px;">Dosyalar alınamadı.</p>';
        });
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url);
      vibrate(30);
      showToast('Link kopyalandı!');
    }

    function openQrModal(url) {
      setupReadyView({ id: url.split('/').pop() });
      document.getElementById('readyLinkText').innerText = url;
      showView('viewReady');
      vibrate(30);
    }

    function deleteFile(id) {
      vibrate(50);
      fetch('/api/files/' + id, { method: 'DELETE' })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            const el = document.getElementById('file-card-' + id);
            if (el) {
              el.style.opacity = '0';
              el.style.transform = 'scale(0.9)';
              setTimeout(() => el.remove(), 300);
            }
            showToast('Dosya silindi!');
          } else {
            showToast('Silme başarısız!');
          }
        })
        .catch(() => {
          showToast('Silme hatası!');
        });
    }
  </script>
</body>
</html>
